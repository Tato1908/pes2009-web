      - name: Parche - juego desde el servidor (carpeta juego/, descarga unica)
        run: |
          python3 - <<'EOF'
          import sys
          p = "upstream/wasm-page/public/ppsspp-runtime.js"
          s = open(p).read()
          def rep(old, new, f="ppsspp-runtime.js"):
              global s
              assert s.count(old) == 1, f + " (juego servidor): no se encontro: " + old[:70]
              s = s.replace(old, new)
          JUEGO_JS = '/* ── pes2009-web: juego servido desde el servidor (carpeta juego/) ──\n   Si existe juego/juego.json, la pagina descarga ese juego una sola vez, lo guarda en el\n   navegador (OPFS) y deja el boton listo para jugar. Sin juego.json se usa el flujo normal. */\nlet juegoDescargando = false;\nfunction juegoTexto(titulo, subtitulo, boton) {\n  const kicker = document.querySelector("#idleOverlay .idle-kicker");\n  const title = document.querySelector("#idleOverlay .idle-title");\n  if (kicker && juegoTexto.nombre) kicker.textContent = juegoTexto.nombre;\n  if (title && titulo != null) title.textContent = titulo;\n  if (idleSubtitle && subtitulo != null) idleSubtitle.textContent = subtitulo;\n  if (idleStartBtn && boton != null) idleStartBtn.innerHTML = "<span>" + boton + "</span>";\n}\nfunction juegoMB(n) { return (n / 1048576).toFixed(0) + " MB"; }\nasync function juegoServidor() {\n  let cfg;\n  try {\n    const r = await fetch("juego/juego.json?t=" + Date.now(), { cache: "no-store" });\n    if (!r.ok) return false;\n    cfg = await r.json();\n  } catch(e) { return false; }\n  if (!cfg || !cfg.archivo) return false;\n  const url = new URL("juego/" + cfg.archivo, location.href).href;\n  const nombre = cfg.nombre || prettyGameName(cfg.archivo);\n  const safe = String(cfg.archivo).split("/").pop().replace(/[^a-zA-Z0-9._-]/g, "_");\n  juegoTexto.nombre = nombre;\n  try { await navigator.storage?.persist?.(); } catch(e) {}\n\n  // tamano en el servidor (para saber si la copia guardada esta completa y al dia)\n  let total = 0;\n  try {\n    const h = await fetch(url, { method: "HEAD", cache: "no-store" });\n    if (!h.ok) throw new Error("HTTP " + h.status);\n    total = parseInt(h.headers.get("content-length") || "0", 10) || 0;\n  } catch(e) {\n    log("Juego del servidor: no se encontro " + url + " (" + e.message + ")", "warn");\n    juegoTexto("No se encontro el juego.", "El servidor tiene juego/juego.json pero falta el archivo \\"" + cfg.archivo + "\\".", null);\n    return true;\n  }\n  let guardado = 0;\n  try { guardado = (await opfsGetGameFile(safe)).size; } catch(e) {}\n  if (!guardado || (total && guardado !== total)) {\n    juegoDescargando = true;\n    if (idleStartBtn) idleStartBtn.disabled = true;\n    juegoTexto("Descargando " + nombre + "...", "Solo la primera vez. Queda guardado en este navegador.", "Descargando...");\n    let w = null;\n    try {\n      const { dir, name } = await opfsParent(safe, true, OPFS_GAMES_DIR);\n      w = await (await dir.getFileHandle(name, { create: true })).createWritable();\n      const res = await fetch(url, { cache: "no-store" });\n      if (!res.ok || !res.body) throw new Error("HTTP " + res.status);\n      const reader = res.body.getReader();\n      let bajado = 0, ultimo = 0;\n      for (;;) {\n        const { done, value } = await reader.read();\n        if (done) break;\n        await w.write(value);\n        bajado += value.byteLength;\n        const now = performance.now();\n        if (now - ultimo > 250) {\n          ultimo = now;\n          const txt = total ? Math.floor(bajado * 100 / total) + "%  (" + juegoMB(bajado) + " de " + juegoMB(total) + ")" : juegoMB(bajado);\n          juegoTexto(null, "Descargando: " + txt + ". Solo la primera vez.", null);\n          if (stageMiniTextEl) stageMiniTextEl.textContent = "Descargando " + nombre + ": " + txt;\n          if (statusEl) statusEl.textContent = "Descargando " + nombre + ": " + txt;\n        }\n      }\n      await w.close();\n      w = null;\n      if (total && bajado !== total) throw new Error("descarga incompleta (" + bajado + " de " + total + " bytes)");\n      setPreloadFavorite(safe, true);\n      log("Juego del servidor guardado en el navegador: " + safe + " (" + juegoMB(bajado) + ")", "ok");\n      refreshLibrary();\n      updateStorageInfo();\n    } catch(e) {\n      juegoDescargando = false;\n      if (idleStartBtn) idleStartBtn.disabled = false;\n      try { if (w) await w.abort(); } catch(_) {}\n      try { await opfsDeleteGame(safe); } catch(_) {}\n      log("Juego del servidor: fallo la descarga: " + e.message, "err");\n      juegoTexto("No se pudo descargar.", "Error: " + e.message + ". Recarga la pagina para reintentar.", "Reintentar");\n      if (idleStartBtn) idleStartBtn.onclick = () => location.reload();\n      return true;\n    }\n    juegoDescargando = false;\n    if (idleStartBtn) idleStartBtn.disabled = false;\n  }\n  if (started) return true;\n  selectedGame = null;\n  selectedStoredGame = safe;\n  setStatus("Listo: " + nombre, "ok");\n  juegoTexto("Listo para jugar.", nombre + " esta guardado en este navegador.", "▶ Jugar");\n  return true;\n}\njuegoServidor().then(usado => { if (!usado) pesAutoSelect(); });\n\n'
          rep("pesAutoSelect();\n\n/* \u2500\u2500 PWA", JUEGO_JS + "/* \u2500\u2500 PWA")
          rep("async function start() {\n  if (started) return;\n",
              "async function start() {\n  if (started) return;\n"
              "  if (juegoDescargando) { setStatus(\"Espera a que termine la descarga del juego\", \"warn\"); return; }\n")
          open(p, "w").write(s)

          p = "upstream/wasm-page/public/sw.js"
          s = open(p).read()
          rep("  const pathname = url.pathname;\n",
              "  const pathname = url.pathname;\n"
              "  if (pathname.includes(\"/juego/\")) return;   // pes2009-web: el juego y su juego.json nunca se cachean aqui\n", "sw.js")
          open(p, "w").write(s)

          p = "upstream/server/serve.py"
          s = open(p).read()
          rep('        if request_path.startswith(("/wasm-page/", "/server/")):\n',
              '        if request_path.startswith("/juego/"):\n'
              '            return self._translate_under(self.web_root, request_path)\n'
              '        if request_path.startswith(("/wasm-page/", "/server/")):\n', "serve.py")
          open(p, "w").write(s)
          print("Parche de juego desde el servidor aplicado")
          EOF

      - name: Compilar PPSSPP a WebAssembly (tarda bastante)
        working-directory: upstream
        run: make wasm-release WASM_ROOT=../ppsspp-wasm-src CMAKE=/usr/bin/cmake WASM_JOBS="-j$(nproc)"

      - name: Compilar la página
        working-directory: upstream
        run: |
          npm --prefix wasm-page ci
          make app-build-pages WASM_ROOT=../ppsspp-wasm-src

      - name: Armar paquete local con servidor multijugador
        run: |
          mkdir -p local/pes2009-local/wasm-page/dist local/pes2009-local/server
          cp -a upstream/wasm-page/dist/ppsspp-web local/pes2009-local/wasm-page/dist/
          cp upstream/server/serve.py local/pes2009-local/server/
          mkdir -p local/pes2009-local/juego
          printf '%s\r\n' \
            'JUEGO DESDE EL SERVIDOR' \
            '' \
            'Pon aqui un juego de PSP que tengas derecho a distribuir (homebrew libre, tu propio juego, etc.)' \
            'y crea juego.json (copia juego.json.ejemplo) con el nombre del archivo.' \
            '' \
            'Al abrir la pagina, cada jugador lo descarga UNA sola vez; queda guardado en su navegador' \
            'y desde ahi arranca con un clic en Jugar.' \
            '' \
            'Si no hay juego.json, la pagina funciona como antes: cada uno elige su propio archivo.' \
            'Si cambias el archivo por otro de distinto tamano, los navegadores lo vuelven a descargar.' > local/pes2009-local/juego/LEEME.txt
          printf '%s\n' '{' '  "nombre": "Mi juego",' '  "archivo": "mi-juego.iso"' '}' > local/pes2009-local/juego/juego.json.ejemplo
          printf '%s\r\n' \
            '@echo off' \
            'cd /d "%~dp0"' \
            'echo Abre en el navegador: http://localhost:8081' \
            'echo Para cerrar el servidor: Ctrl + C' \
            'start "" http://localhost:8081' \
            'where py >nul 2>nul && (py server\serve.py --bind 127.0.0.1 --port 8081 --web-root . --wasm-root wasm-page\dist\ppsspp-web --adhoc-ws) || (python server\serve.py --bind 127.0.0.1 --port 8081 --web-root . --wasm-root wasm-page\dist\ppsspp-web --adhoc-ws)' \
            'pause' > local/pes2009-local/iniciar.bat
          OWNER="$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')"
          PAGINA="https://${OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          echo "Pagina publica: $PAGINA"
          PAGINA="$PAGINA" python3 - <<'EOF'
          import os
          ps1 = 'param(\n  [string]$Cloudflared = "",\n  [string]$Python = "",\n  [switch]$NoBrowser,\n  [switch]$NoWait\n)\n# PES 2009 Web - modo online: servidor de salas en este PC + tunel gratis de Cloudflare.\n$ErrorActionPreference = "Stop"\n$Pagina = "__PAGINA__"\nSet-Location -LiteralPath $PSScriptRoot\n\nWrite-Host ""\nWrite-Host "=== PES 2009 Web - modo online ===" -ForegroundColor Cyan\n\nif (-not $Cloudflared) {\n  $Cloudflared = Join-Path $PSScriptRoot "cloudflared.exe"\n  if (-not (Test-Path -LiteralPath $Cloudflared)) {\n    Write-Host "Descargando cloudflared (solo la primera vez)..."\n    [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12\n    $ProgressPreference = "SilentlyContinue"\n    Invoke-WebRequest -UseBasicParsing -OutFile $Cloudflared -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"\n  }\n}\nif (-not $Python) {\n  if (Get-Command py -ErrorAction SilentlyContinue) { $Python = "py" } else { $Python = "python" }\n}\n\n$log = Join-Path ([IO.Path]::GetTempPath()) "pes2009-cloudflared.log"\n$errLog = Join-Path ([IO.Path]::GetTempPath()) "pes2009-cloudflared-err.log"\n$outLog = Join-Path ([IO.Path]::GetTempPath()) "pes2009-cloudflared-out.log"\nforeach ($f in @($log, $errLog, $outLog)) { if (Test-Path -LiteralPath $f) { Remove-Item -LiteralPath $f -Force } }\n\nfunction Stop-Todo {\n  foreach ($p in @($script:tunnel, $script:server)) {\n    if ($p -and -not $p.HasExited) {\n      if ($env:OS -eq "Windows_NT") { & taskkill.exe /T /F /PID $p.Id | Out-Null }\n      else { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }\n    }\n  }\n}\n\nfunction Leer-Log {\n  $t = ""\n  foreach ($f in @($log, $errLog, $outLog)) {\n    try {\n      $fs = [IO.File]::Open($f, [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]::ReadWrite)\n      $sr = New-Object IO.StreamReader($fs)\n      $t += $sr.ReadToEnd() + "`n"\n      $sr.Close()\n    } catch { }\n  }\n  return $t\n}\n\nWrite-Host "1/2 Iniciando servidor de salas (se abre en otra ventana)..."\n$serverArgs = @("server/serve.py", "--bind", "127.0.0.1", "--port", "8081", "--web-root", ".",\n                "--wasm-root", "wasm-page/dist/ppsspp-web", "--adhoc-ws")\n$script:server = Start-Process -FilePath $Python -ArgumentList $serverArgs -WorkingDirectory $PSScriptRoot -PassThru\n\nWrite-Host "2/2 Abriendo tunel de Cloudflare..."\n$tunnelArgs = @("tunnel", "--no-autoupdate", "--url", "http://127.0.0.1:27312", "--logfile", $log)\n$script:tunnel = Start-Process -FilePath $Cloudflared -ArgumentList $tunnelArgs -PassThru -RedirectStandardError $errLog -RedirectStandardOutput $outLog\n\n# Esperar la direccion publica del tunel\n$relay = $null\nfor ($i = 0; $i -lt 60 -and -not $relay; $i++) {\n  Start-Sleep -Seconds 1\n  if ($script:tunnel.HasExited) { break }\n  foreach ($m in [regex]::Matches((Leer-Log), \'https://([a-z0-9-]+\\.trycloudflare\\.com)\')) {\n    if ($m.Groups[1].Value -notmatch \'^api\\.\') { $relay = $m.Groups[1].Value; break }\n  }\n}\nif (-not $relay) {\n  Write-Host ""\n  Write-Host "No se pudo abrir el tunel de Cloudflare." -ForegroundColor Red\n  if ($script:tunnel.HasExited) { Write-Host "cloudflared se cerro con codigo $($script:tunnel.ExitCode)." }\n  Write-Host "Ultimas lineas de cloudflared:"\n  (Leer-Log) -split "`n" | Where-Object { $_.Trim() } | Select-Object -Last 20 | ForEach-Object { Write-Host "  $_" }\n  Write-Host "Archivo cloudflared: $Cloudflared ($((Get-Item -LiteralPath $Cloudflared).Length) bytes)"\n  Stop-Todo\n  if (-not $NoWait) { Read-Host "Presiona Enter para salir" | Out-Null }\n  exit 1\n}\n\n# Esperar a que el tunel quede conectado (unos segundos)\nfor ($i = 0; $i -lt 20; $i++) {\n  if ((Leer-Log) -match \'Registered tunnel connection\') { break }\n  Start-Sleep -Seconds 1\n}\n\n$link = $Pagina + "?relay=" + $relay\ntry { Set-Clipboard -Value $link } catch { }\nWrite-Host ""\n$local = "http://localhost:8081/"\nWrite-Host "LISTO." -ForegroundColor Green\nWrite-Host ""\nWrite-Host "Link para tu RIVAL (ya esta copiado, mandaselo):" -ForegroundColor Green\nWrite-Host "  $link" -ForegroundColor Yellow\nWrite-Host ""\nWrite-Host "TU juegas desde este otro link (directo a tu servidor, sin pasar por internet):" -ForegroundColor Green\nWrite-Host "  $local" -ForegroundColor Yellow\nWrite-Host ""\nWrite-Host "Cada uno carga su propio ISO. Deja esta ventana y la del servidor abiertas mientras juegan."\nif (-not $NoBrowser) { Start-Process $local }\nif (-not $NoWait) { Read-Host "Presiona Enter para cerrar el servidor y el tunel" | Out-Null }\nStop-Todo\n'
          bat = '@echo off\r\ncd /d "%~dp0"\r\npowershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0iniciar-online.ps1"\r\npause\r\n'
          ps1 = ps1.replace('__PAGINA__', os.environ['PAGINA']).replace('\n', '\r\n')
          open('local/pes2009-local/iniciar-online.ps1', 'w', newline='').write(ps1)
          open('local/pes2009-local/iniciar-online.bat', 'w', newline='').write(bat)
          print('iniciar-online.ps1 / .bat creados')
          EOF

      - name: Subir paquete local (descargable en la ejecución)
        uses: actions/upload-artifact@v4
        with:
          name: pes2009-local
          path: local

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: upstream/wasm-page/dist/ppsspp-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
