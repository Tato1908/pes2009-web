# Compila PPSSPP a WebAssembly en la nube de GitHub y lo publica en GitHub Pages.
# No incluye ningún juego: el ISO se carga desde tu PC con "Load Game".
name: Build PPSSPP Web

on:
  workflow_dispatch:      # botón "Run workflow" en la pestaña Actions
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: emscripten/emsdk:5.0.7
    steps:
      - name: Descargar interfaz web (ppsspp-web)
        uses: actions/checkout@v6
        with:
          repository: root-hunter/ppsspp-web
          ref: wasm
          path: upstream
          fetch-depth: 1

      - name: Descargar emulador (ppsspp-wasm)
        uses: actions/checkout@v6
        with:
          repository: root-hunter/ppsspp-wasm
          ref: wasm
          path: ppsspp-wasm-src
          submodules: recursive
          fetch-depth: 1

      - name: Preparar herramientas
        run: |
          git config --global --add safe.directory '*'
          apt-get update
          apt-get install -y --no-install-recommends ninja-build ca-certificates python3

      - name: Parche - DNS del multijugador en WebAssembly
        # El getaddrinfo de Emscripten rechaza AI_ADDRCONFIG ("TODO" en su código) y
        # PPSSPP no puede resolver el servidor ad-hoc ("DNS Error Resolving 127.0.0.1").
        run: |
          python3 - <<'EOF'
          p = "ppsspp-wasm-src/Common/Net/Resolve.cpp"
          s = open(p).read()
          old = "\thints.ai_flags = /*AI_V4MAPPED |*/ AI_ADDRCONFIG;\n"
          new = ("#ifdef __EMSCRIPTEN__\n"
                 "\thints.ai_flags = 0;  // Emscripten getaddrinfo devuelve EAI_NONAME con AI_ADDRCONFIG\n"
                 "#else\n" + old + "#endif\n")
          assert s.count(old) == 1, "No se encontró la línea a parchear en Resolve.cpp"
          open(p, "w").write(s.replace(old, new))
          print("Parche DNS aplicado")
          EOF

      - name: Parche - conexión al lobby ad-hoc
        # 1) PPSSPP no se conecta si el servidor es 127.0.0.1 (regla de escritorio
        #    para varias instancias); en el navegador cada pestaña es una PSP aparte.
        # 2) El puente de red de la página mandaba también la conexión al lobby
        #    (puerto 27312) por el canal PTP; debe ir directo al lobby.
        run: |
          python3 - <<'EOF'
          p = "ppsspp-wasm-src/Core/HLE/proAdhoc.cpp"
          s = open(p).read()
          old = ("\tif (g_adhocServerIP.in.sin_addr.s_addr == g_localhostIP.in.sin_addr.s_addr && !g_Config.bEnableAdhocServer)\n"
                 "\t\treturn SOCKET_ERROR;\n")
          assert s.count(old) == 1, "No se encontró el chequeo de localhost en proAdhoc.cpp"
          open(p, "w").write(s.replace(old, "#ifndef __EMSCRIPTEN__\n" + old + "#endif\n"))

          p = "upstream/wasm-page/public/ppsspp-runtime.js"
          s = open(p).read()
          old = ("  ops.connect = function(sock, addr, port) {\n"
                 "    if (sock.type !== 1 || !loadNetworkConfig().enabled) {\n")
          new = ("  ops.connect = function(sock, addr, port) {\n"
                 "    if (sock.type !== 1 || !loadNetworkConfig().enabled || port === ADHOC_WS_PORT) {\n")
          assert s.count(old) == 1, "No se encontró ops.connect en ppsspp-runtime.js"
          open(p, "w").write(s.replace(old, new))
          print("Parches de lobby aplicados")
          EOF

      - name: Parche - reconexión del canal UDP y registro
        # Si el WebSocket UDP de un jugador se cae, el puente original no reconecta y
        # los paquetes quedan en cola para siempre (el rival "desaparece").
        run: |
          python3 - <<'EOF'
          p = "upstream/wasm-page/public/ppsspp-runtime.js"
          s = open(p).read()
          old = ("    relay.ws.onclose = () => { relay.open = false; };\n"
                 "    relay.ws.onerror = () => { relay.open = false; };\n"
                 "    sock.__ppssppRelay = relay;\n")
          new = ("    relay.ws.onclose = (ev) => {\n"
                 "      relay.open = false;\n"
                 "      log(\"Network: UDP relay closed port \" + sock.sport + \" code=\" + ev.code +\n"
                 "          (relay.closedByGame ? \" (el juego cerro el socket)\" : \" - reconectando\"), relay.closedByGame ? \"\" : \"warn\");\n"
                 "      if (relay.closedByGame || sock.__ppssppClosed || sock.__ppssppRelay !== relay) return;\n"
                 "      sock.__ppssppRelay = null;\n"
                 "      setTimeout(() => {\n"
                 "        if (sock.__ppssppClosed || sock.__ppssppRelay) return;\n"
                 "        openRelay(sock);\n"
                 "        if (sock.__ppssppRelay) sock.__ppssppRelay.queue.push(...relay.queue);\n"
                 "      }, 250);\n"
                 "    };\n"
                 "    relay.ws.onerror = () => { relay.open = false; };\n"
                 "    sock.__ppssppRelay = relay;\n"
                 "    log(\"Network: UDP relay open port \" + sock.sport);\n")
          assert s.count(old) == 1, "No se encontró el onclose del relay UDP"
          s = s.replace(old, new)
          old = ("    if (sock.__ppssppRelay) {\n"
                 "      try { sock.__ppssppRelay.ws.close(); } catch(e) {}\n")
          new = ("    sock.__ppssppClosed = true;\n"
                 "    if (sock.__ppssppRelay) {\n"
                 "      sock.__ppssppRelay.closedByGame = true;\n"
                 "      try { sock.__ppssppRelay.ws.close(); } catch(e) {}\n")
          assert s.count(old) == 1, "No se encontró ops.close"
          s = s.replace(old, new)
          open(p, "w").write(s)
          print("Parche de reconexion UDP aplicado")
          EOF

      - name: Parche - MSG_PEEK en WebAssembly (paquetes perdidos)
        # Emscripten ignora MSG_PEEK en recv/recvfrom y consume el paquete. PPSSPP "mira"
        # cada paquete antes de leerlo, asi que se perdian casi todos: el rival aparecia
        # un instante y luego "No hubo comunicacion del rival".
        run: |
          python3 - <<'EOF'
          p = "ppsspp-wasm-src/Core/HLE/sceNetAdhoc.cpp"
          s = open(p).read()
          anchor = '#include "ext/aemu_postoffice/client/postoffice_client.h"\n'
          assert s.count(anchor) == 1, "No se encontro el punto de insercion en sceNetAdhoc.cpp"
          inc = r'''
          #ifdef __EMSCRIPTEN__
          // pes2009-web: Emscripten's recv/recvfrom ignore MSG_PEEK and consume the data.
          // PPSSPP peeks every adhoc packet before reading it, so without this the real read
          // gets the NEXT packet (or nothing) and most PDP/PTP traffic is lost.
          #include <map>
          #include <vector>
          #include <cstring>
          #include <algorithm>
          namespace {
          struct WasmPeekEntry {
          	std::vector<char> data;
          	sockaddr_storage from;
          	socklen_t fromlen;
          };
          std::map<int, WasmPeekEntry> g_wasmPeek;
          std::mutex g_wasmPeekLock;
          }

          static int wasm_recvfrom(int fd, void *buf, size_t len, int flags, sockaddr *from, socklen_t *fromlen) {
          	std::lock_guard<std::mutex> guard(g_wasmPeekLock);
          	auto it = g_wasmPeek.find(fd);
          	if (it == g_wasmPeek.end()) {
          		if (!(flags & MSG_PEEK))
          			return (int)::recvfrom(fd, buf, len, flags, from, fromlen);
          		WasmPeekEntry e;
          		e.data.resize(65536);
          		memset(&e.from, 0, sizeof(e.from));
          		e.fromlen = sizeof(e.from);
          		int r = (int)::recvfrom(fd, e.data.data(), e.data.size(), flags & ~MSG_PEEK, (sockaddr *)&e.from, &e.fromlen);
          		if (r < 0)
          			return r;
          		e.data.resize(r);
          		it = g_wasmPeek.emplace(fd, std::move(e)).first;
          	}
          	WasmPeekEntry &e = it->second;
          	size_t n = std::min(len, e.data.size());
          	if (n)
          		memcpy(buf, e.data.data(), n);
          	if (from && fromlen) {
          		memcpy(from, &e.from, std::min(*fromlen, e.fromlen));
          		*fromlen = e.fromlen;
          	}
          	if (!(flags & MSG_PEEK))
          		g_wasmPeek.erase(it);  // datagram: the rest of a truncated packet is discarded
          	return (int)n;
          }

          static int wasm_recv(int fd, void *buf, size_t len, int flags) {
          	std::lock_guard<std::mutex> guard(g_wasmPeekLock);
          	auto it = g_wasmPeek.find(fd);
          	if (flags & MSG_PEEK) {
          		if (it == g_wasmPeek.end()) {
          			WasmPeekEntry e;
          			e.data.resize(65536);
          			e.fromlen = 0;
          			int r = (int)::recv(fd, e.data.data(), e.data.size(), flags & ~MSG_PEEK);
          			if (r <= 0)
          				return r;
          			e.data.resize(r);
          			it = g_wasmPeek.emplace(fd, std::move(e)).first;
          		}
          		size_t n = std::min(len, it->second.data.size());
          		memcpy(buf, it->second.data.data(), n);
          		return (int)n;
          	}
          	if (it == g_wasmPeek.end())
          		return (int)::recv(fd, buf, len, flags);
          	WasmPeekEntry &e = it->second;  // stream: hand out stashed bytes first, keep the rest
          	size_t n = std::min(len, e.data.size());
          	memcpy(buf, e.data.data(), n);
          	e.data.erase(e.data.begin(), e.data.begin() + n);
          	if (e.data.empty())
          		g_wasmPeek.erase(it);
          	return (int)n;
          }

          static int wasm_closesocket(int fd) {
          	{
          		std::lock_guard<std::mutex> guard(g_wasmPeekLock);
          		g_wasmPeek.erase(fd);
          	}
          	return ::close(fd);
          }

          #define recvfrom(...) wasm_recvfrom(__VA_ARGS__)
          #define recv(...) wasm_recv(__VA_ARGS__)
          #undef closesocket
          #define closesocket(s) wasm_closesocket(s)
          #endif
          '''
          inc = "\n".join(l[10:] if l.startswith(" " * 10) else l for l in inc.splitlines()) + "\n"
          s = s.replace(anchor, anchor + inc)
          open(p, "w").write(s)
          print("Parche MSG_PEEK aplicado")
          EOF

      - name: Parche - servidor de salas (diagnostico UDP, candado de envio)
        run: |
          python3 - <<'EOF'
          p = "upstream/server/serve.py"
          s = open(p).read()
          R = [
            ('        if target and source_host:\n            target.send_udp(source_host, source_port, payload)\n',
             '        if target and source_host:\n            target.send_udp(source_host, source_port, payload)\n            reason = "ok"\n        elif not source_host:\n            reason = "origen sin login"\n        elif not dst_mac:\n            reason = "IP destino desconocida"\n        else:\n            reason = "destino sin UDP en ese puerto"\n        _udp_stat(f"{source_host or source_mac}:{source_port} -> {dst_host}:{dst_port}", reason, len(payload))\n'),
            ('\nclass AdhocUser:',
             '\n_UDP_STATS = {}\n_UDP_LOCK = threading.Lock()\n\ndef _udp_stat(route, reason, size):\n    with _UDP_LOCK:\n        c = _UDP_STATS.setdefault((route, reason), [0, 0])\n        c[0] += 1\n        c[1] += size\n\ndef _udp_report_loop():\n    while True:\n        time.sleep(3)\n        with _UDP_LOCK:\n            items = sorted(_UDP_STATS.items())\n            _UDP_STATS.clear()\n        for (route, reason), (n, b) in items:\n            print(f"UDP {time.strftime(\'%H:%M:%S\')}: {route}  {n} paq / {b} bytes  [{reason}]", flush=True)\n\n\nclass AdhocUser:'),
            ('        threading.Thread(target=adhoc_server.serve_forever, name="AdhocWebSocketServer", daemon=True).start()\n',
             '        threading.Thread(target=adhoc_server.serve_forever, name="AdhocWebSocketServer", daemon=True).start()\n        threading.Thread(target=_udp_report_loop, name="UdpReport", daemon=True).start()\n'),
            ('        self.user = AdhocUser(self)\n        self.alive = True\n',
             '        self.user = AdhocUser(self)\n        self.alive = True\n        self.send_lock = threading.Lock()\n        self.opened_at = time.time()\n'),
            ('            self.request.sendall(self._frame(payload))\n',
             '            with self.send_lock:\n                self.request.sendall(self._frame(payload))\n'),
            ('            self.request.sendall(self._frame(payload, opcode=10))\n',
             '            with self.send_lock:\n                self.request.sendall(self._frame(payload, opcode=10))\n'),
            ('        finally:\n            self.lobby.unregister_udp(self.udp_mac, self.udp_port, self)\n',
             '        finally:\n            self.lobby.unregister_udp(self.udp_mac, self.udp_port, self)\n            print(f"Adhoc WS: canal UDP cerrado {self.udp_mac}:{self.udp_port} tras {time.time() - self.opened_at:.1f}s", flush=True)\n'),
          ]
          for a, b in R:
              assert s.count(a) == 1, "serve.py: no se encontro: " + a[:60]
              s = s.replace(a, b)
          open(p, "w").write(s)
          print("Parche de servidor aplicado")
          EOF

      - name: Compilar PPSSPP a WebAssembly (tarda bastante)
        working-directory: upstream
        run: make wasm-release WASM_ROOT=../ppsspp-wasm-src CMAKE=/usr/bin/cmake WASM_JOBS="-j$(nproc)"

      - name: Compilar la página
        working-directory: upstream
        run: |
          npm --prefix wasm-page ci
          make app-build-pages WASM_ROOT=../ppsspp-wasm-src

      - name: Armar paquete local con servidor multijugador
        run: |
          mkdir -p local/pes2009-local/wasm-page/dist local/pes2009-local/server
          cp -a upstream/wasm-page/dist/ppsspp-web local/pes2009-local/wasm-page/dist/
          cp upstream/server/serve.py local/pes2009-local/server/
          printf '%s\r\n' \
            '@echo off' \
            'cd /d "%~dp0"' \
            'echo Abre en el navegador: http://localhost:8081' \
            'echo Para cerrar el servidor: Ctrl + C' \
            'start "" http://localhost:8081' \
            'where py >nul 2>nul && (py server\serve.py --bind 127.0.0.1 --port 8081 --web-root . --wasm-root wasm-page\dist\ppsspp-web --adhoc-ws) || (python server\serve.py --bind 127.0.0.1 --port 8081 --web-root . --wasm-root wasm-page\dist\ppsspp-web --adhoc-ws)' \
            'pause' > local/pes2009-local/iniciar.bat

      - name: Subir paquete local (descargable en la ejecución)
        uses: actions/upload-artifact@v4
        with:
          name: pes2009-local
          path: local

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: upstream/wasm-page/dist/ppsspp-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
