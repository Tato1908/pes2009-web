# Compila PPSSPP a WebAssembly en la nube de GitHub y lo publica en GitHub Pages.
# No incluye ningún juego: el ISO se carga desde tu PC con "Load Game".
name: Build PPSSPP Web

on:
  workflow_dispatch:      # botón "Run workflow" en la pestaña Actions
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: emscripten/emsdk:5.0.7
    steps:
      - name: Descargar interfaz web (ppsspp-web)
        uses: actions/checkout@v6
        with:
          repository: root-hunter/ppsspp-web
          ref: wasm
          path: upstream
          fetch-depth: 1

      - name: Descargar emulador (ppsspp-wasm)
        uses: actions/checkout@v6
        with:
          repository: root-hunter/ppsspp-wasm
          ref: wasm
          path: ppsspp-wasm-src
          submodules: recursive
          fetch-depth: 1

      - name: Preparar herramientas
        run: |
          git config --global --add safe.directory '*'
          apt-get update
          apt-get install -y --no-install-recommends ninja-build ca-certificates python3

      - name: Parche - DNS del multijugador en WebAssembly
        # El getaddrinfo de Emscripten rechaza AI_ADDRCONFIG ("TODO" en su código) y
        # PPSSPP no puede resolver el servidor ad-hoc ("DNS Error Resolving 127.0.0.1").
        run: |
          python3 - <<'EOF'
          p = "ppsspp-wasm-src/Common/Net/Resolve.cpp"
          s = open(p).read()
          old = "\thints.ai_flags = /*AI_V4MAPPED |*/ AI_ADDRCONFIG;\n"
          new = ("#ifdef __EMSCRIPTEN__\n"
                 "\thints.ai_flags = 0;  // Emscripten getaddrinfo devuelve EAI_NONAME con AI_ADDRCONFIG\n"
                 "#else\n" + old + "#endif\n")
          assert s.count(old) == 1, "No se encontró la línea a parchear en Resolve.cpp"
          open(p, "w").write(s.replace(old, new))
          print("Parche DNS aplicado")
          EOF

      - name: Parche - conexión al lobby ad-hoc
        # 1) PPSSPP no se conecta si el servidor es 127.0.0.1 (regla de escritorio
        #    para varias instancias); en el navegador cada pestaña es una PSP aparte.
        # 2) El puente de red de la página mandaba también la conexión al lobby
        #    (puerto 27312) por el canal PTP; debe ir directo al lobby.
        run: |
          python3 - <<'EOF'
          p = "ppsspp-wasm-src/Core/HLE/proAdhoc.cpp"
          s = open(p).read()
          old = ("\tif (g_adhocServerIP.in.sin_addr.s_addr == g_localhostIP.in.sin_addr.s_addr && !g_Config.bEnableAdhocServer)\n"
                 "\t\treturn SOCKET_ERROR;\n")
          assert s.count(old) == 1, "No se encontró el chequeo de localhost en proAdhoc.cpp"
          open(p, "w").write(s.replace(old, "#ifndef __EMSCRIPTEN__\n" + old + "#endif\n"))

          p = "upstream/wasm-page/public/ppsspp-runtime.js"
          s = open(p).read()
          old = ("  ops.connect = function(sock, addr, port) {\n"
                 "    if (sock.type !== 1 || !loadNetworkConfig().enabled) {\n")
          new = ("  ops.connect = function(sock, addr, port) {\n"
                 "    if (sock.type !== 1 || !loadNetworkConfig().enabled || port === ADHOC_WS_PORT) {\n")
          assert s.count(old) == 1, "No se encontró ops.connect en ppsspp-runtime.js"
          open(p, "w").write(s.replace(old, new))
          print("Parches de lobby aplicados")
          EOF

      - name: Parche - reconexión del canal UDP y registro
        # Si el WebSocket UDP de un jugador se cae, el puente original no reconecta y
        # los paquetes quedan en cola para siempre (el rival "desaparece").
        run: |
          python3 - <<'EOF'
          p = "upstream/wasm-page/public/ppsspp-runtime.js"
          s = open(p).read()
          old = ("    relay.ws.onclose = () => { relay.open = false; };\n"
                 "    relay.ws.onerror = () => { relay.open = false; };\n"
                 "    sock.__ppssppRelay = relay;\n")
          new = ("    relay.ws.onclose = (ev) => {\n"
                 "      relay.open = false;\n"
                 "      log(\"Network: UDP relay closed port \" + sock.sport + \" code=\" + ev.code +\n"
                 "          (relay.closedByGame ? \" (el juego cerro el socket)\" : \" - reconectando\"), relay.closedByGame ? \"\" : \"warn\");\n"
                 "      if (relay.closedByGame || sock.__ppssppClosed || sock.__ppssppRelay !== relay) return;\n"
                 "      sock.__ppssppRelay = null;\n"
                 "      setTimeout(() => {\n"
                 "        if (sock.__ppssppClosed || sock.__ppssppRelay) return;\n"
                 "        openRelay(sock);\n"
                 "        if (sock.__ppssppRelay) sock.__ppssppRelay.queue.push(...relay.queue);\n"
                 "      }, 250);\n"
                 "    };\n"
                 "    relay.ws.onerror = () => { relay.open = false; };\n"
                 "    sock.__ppssppRelay = relay;\n"
                 "    log(\"Network: UDP relay open port \" + sock.sport);\n")
          assert s.count(old) == 1, "No se encontró el onclose del relay UDP"
          s = s.replace(old, new)
          old = ("    if (sock.__ppssppRelay) {\n"
                 "      try { sock.__ppssppRelay.ws.close(); } catch(e) {}\n")
          new = ("    sock.__ppssppClosed = true;\n"
                 "    if (sock.__ppssppRelay) {\n"
                 "      sock.__ppssppRelay.closedByGame = true;\n"
                 "      try { sock.__ppssppRelay.ws.close(); } catch(e) {}\n")
          assert s.count(old) == 1, "No se encontró ops.close"
          s = s.replace(old, new)
          open(p, "w").write(s)
          print("Parche de reconexion UDP aplicado")
          EOF

      - name: Parche - MSG_PEEK en WebAssembly (paquetes perdidos)
        # Emscripten ignora MSG_PEEK en recv/recvfrom y consume el paquete. PPSSPP "mira"
        # cada paquete antes de leerlo, asi que se perdian casi todos: el rival aparecia
        # un instante y luego "No hubo comunicacion del rival".
        run: |
          python3 - <<'EOF'
          p = "ppsspp-wasm-src/Core/HLE/sceNetAdhoc.cpp"
          s = open(p).read()
          anchor = '#include "ext/aemu_postoffice/client/postoffice_client.h"\n'
          assert s.count(anchor) == 1, "No se encontro el punto de insercion en sceNetAdhoc.cpp"
          inc = r'''
          #ifdef __EMSCRIPTEN__
          // pes2009-web: Emscripten's recv/recvfrom ignore MSG_PEEK and consume the data.
          // PPSSPP peeks every adhoc packet before reading it, so without this the real read
          // gets the NEXT packet (or nothing) and most PDP/PTP traffic is lost.
          #include <map>
          #include <vector>
          #include <cstring>
          #include <algorithm>
          namespace {
          struct WasmPeekEntry {
          	std::vector<char> data;
          	sockaddr_storage from;
          	socklen_t fromlen;
          };
          std::map<int, WasmPeekEntry> g_wasmPeek;
          std::mutex g_wasmPeekLock;
          }

          static int wasm_recvfrom(int fd, void *buf, size_t len, int flags, sockaddr *from, socklen_t *fromlen) {
          	std::lock_guard<std::mutex> guard(g_wasmPeekLock);
          	auto it = g_wasmPeek.find(fd);
          	if (it == g_wasmPeek.end()) {
          		if (!(flags & MSG_PEEK))
          			return (int)::recvfrom(fd, buf, len, flags, from, fromlen);
          		WasmPeekEntry e;
          		e.data.resize(65536);
          		memset(&e.from, 0, sizeof(e.from));
          		e.fromlen = sizeof(e.from);
          		int r = (int)::recvfrom(fd, e.data.data(), e.data.size(), flags & ~MSG_PEEK, (sockaddr *)&e.from, &e.fromlen);
          		if (r < 0)
          			return r;
          		e.data.resize(r);
          		it = g_wasmPeek.emplace(fd, std::move(e)).first;
          	}
          	WasmPeekEntry &e = it->second;
          	size_t n = std::min(len, e.data.size());
          	if (n)
          		memcpy(buf, e.data.data(), n);
          	if (from && fromlen) {
          		memcpy(from, &e.from, std::min(*fromlen, e.fromlen));
          		*fromlen = e.fromlen;
          	}
          	if (!(flags & MSG_PEEK))
          		g_wasmPeek.erase(it);  // datagram: the rest of a truncated packet is discarded
          	return (int)n;
          }

          static int wasm_recv(int fd, void *buf, size_t len, int flags) {
          	std::lock_guard<std::mutex> guard(g_wasmPeekLock);
          	auto it = g_wasmPeek.find(fd);
          	if (flags & MSG_PEEK) {
          		if (it == g_wasmPeek.end()) {
          			WasmPeekEntry e;
          			e.data.resize(65536);
          			e.fromlen = 0;
          			int r = (int)::recv(fd, e.data.data(), e.data.size(), flags & ~MSG_PEEK);
          			if (r <= 0)
          				return r;
          			e.data.resize(r);
          			it = g_wasmPeek.emplace(fd, std::move(e)).first;
          		}
          		size_t n = std::min(len, it->second.data.size());
          		memcpy(buf, it->second.data.data(), n);
          		return (int)n;
          	}
          	if (it == g_wasmPeek.end())
          		return (int)::recv(fd, buf, len, flags);
          	WasmPeekEntry &e = it->second;  // stream: hand out stashed bytes first, keep the rest
          	size_t n = std::min(len, e.data.size());
          	memcpy(buf, e.data.data(), n);
          	e.data.erase(e.data.begin(), e.data.begin() + n);
          	if (e.data.empty())
          		g_wasmPeek.erase(it);
          	return (int)n;
          }

          static int wasm_closesocket(int fd) {
          	{
          		std::lock_guard<std::mutex> guard(g_wasmPeekLock);
          		g_wasmPeek.erase(fd);
          	}
          	return ::close(fd);
          }

          #define recvfrom(...) wasm_recvfrom(__VA_ARGS__)
          #define recv(...) wasm_recv(__VA_ARGS__)
          #undef closesocket
          #define closesocket(s) wasm_closesocket(s)
          #endif
          '''
          inc = "\n".join(l[10:] if l.startswith(" " * 10) else l for l in inc.splitlines()) + "\n"
          s = s.replace(anchor, anchor + inc)
          open(p, "w").write(s)
          print("Parche MSG_PEEK aplicado")
          EOF

      - name: Parche - servidor de salas (diagnostico UDP, candado de envio)
        run: |
          python3 - <<'EOF'
          p = "upstream/server/serve.py"
          s = open(p).read()
          R = [
            ('        if target and source_host:\n            target.send_udp(source_host, source_port, payload)\n',
             '        if target and source_host:\n            target.send_udp(source_host, source_port, payload)\n            reason = "ok"\n        elif not source_host:\n            reason = "origen sin login"\n        elif not dst_mac:\n            reason = "IP destino desconocida"\n        else:\n            reason = "destino sin UDP en ese puerto"\n        _udp_stat(f"{source_host or source_mac}:{source_port} -> {dst_host}:{dst_port}", reason, len(payload))\n'),
            ('\nclass AdhocUser:',
             '\n_UDP_STATS = {}\n_UDP_LOCK = threading.Lock()\n\n_UDP_LAST = {}\n\ndef _udp_stat(route, reason, size):\n    now = time.time()\n    with _UDP_LOCK:\n        c = _UDP_STATS.setdefault((route, reason), [0, 0, 0.0])\n        c[0] += 1\n        c[1] += size\n        last = _UDP_LAST.get(route)\n        if last is not None:\n            c[2] = max(c[2], now - last)\n        _UDP_LAST[route] = now\n\ndef _udp_report_loop():\n    while True:\n        time.sleep(3)\n        with _UDP_LOCK:\n            items = sorted(_UDP_STATS.items())\n            _UDP_STATS.clear()\n        for (route, reason), (n, b, gap) in items:\n            aviso = "  <-- CONGELON" if gap >= 0.5 else ""\n            print(f"UDP {time.strftime(\'%H:%M:%S\')}: {route}  {n} paq / {b} bytes  pausa max {gap*1000:.0f} ms  [{reason}]{aviso}", flush=True)\n\n\nclass AdhocUser:'),
            ('        threading.Thread(target=adhoc_server.serve_forever, name="AdhocWebSocketServer", daemon=True).start()\n',
             '        threading.Thread(target=adhoc_server.serve_forever, name="AdhocWebSocketServer", daemon=True).start()\n        threading.Thread(target=_udp_report_loop, name="UdpReport", daemon=True).start()\n'),
            ('        self.user = AdhocUser(self)\n        self.alive = True\n',
             '        self.user = AdhocUser(self)\n        self.alive = True\n        self.send_lock = threading.Lock()\n        self.opened_at = time.time()\n'),
            ('            self.request.sendall(self._frame(payload))\n',
             '            with self.send_lock:\n                self.request.sendall(self._frame(payload))\n'),
            ('            self.request.sendall(self._frame(payload, opcode=10))\n',
             '            with self.send_lock:\n                self.request.sendall(self._frame(payload, opcode=10))\n'),
            ('        finally:\n            self.lobby.unregister_udp(self.udp_mac, self.udp_port, self)\n',
             '        finally:\n            self.lobby.unregister_udp(self.udp_mac, self.udp_port, self)\n            print(f"Adhoc WS: canal UDP cerrado {self.udp_mac}:{self.udp_port} tras {time.time() - self.opened_at:.1f}s", flush=True)\n'),
          ]
          for a, b in R:
              assert s.count(a) == 1, "serve.py: no se encontro: " + a[:60]
              s = s.replace(a, b)
          open(p, "w").write(s)
          print("Parche de servidor aplicado")
          EOF

      - name: Parche - servidor de salas externo (?relay=, modo online con tunel)
        run: |
          python3 - <<'EOF'
          p = "upstream/wasm-page/public/ppsspp-runtime.js"
          s = open(p).read()
          def rep(old, new):
              global s
              assert s.count(old) == 1, "ppsspp-runtime.js: no se encontro: " + old[:70]
              s = s.replace(old, new)

          rep("const ADHOC_WS_PORT      = 27312;\n",
          """const ADHOC_WS_PORT      = 27312;
          // pes2009-web: servidor de salas externo indicado en el link (?relay=host o ?relay=wss://host:puerto)
          const RELAY_OVERRIDE_KEY = "pes2009.relay";
          (function captureRelayOverride() {
            try {
              const v = new URLSearchParams(location.search).get("relay");
              if (v) sessionStorage.setItem(RELAY_OVERRIDE_KEY, v.trim());
            } catch(e) {}
          })();
          function relayOverrideBase() {
            let v = "";
            try {
              v = new URLSearchParams(location.search).get("relay") || sessionStorage.getItem(RELAY_OVERRIDE_KEY) || "";
            } catch(e) {}
            v = v.trim().replace(/\\/+$/, "");
            if (!v) return "";
            if (/^wss?:\\/\\//i.test(v)) return v;
            if (/^https?:\\/\\//i.test(v)) return v.replace(/^http/i, "ws");
            return "wss://" + v;
          }
          """)

          rep("""  const query = new URLSearchParams(params);
            return `${scheme}://${cfg.server}:${ADHOC_WS_PORT}${path}?${query.toString()}`;
          """, """  const query = new URLSearchParams(params);
            const relayBase = relayOverrideBase();
            if (relayBase) return `${relayBase}${path}?${query.toString()}`;
            return `${scheme}://${cfg.server}:${ADHOC_WS_PORT}${path}?${query.toString()}`;
          """)

          rep("""    let nextUrl = String(url);
              if (location.protocol === "https:" && nextUrl.startsWith("ws://")) {
          """, """    let nextUrl = String(url);
              const relayBase = relayOverrideBase();
              if (relayBase) {
                try {
                  const parsed = new URL(nextUrl);
                  if (parsed.port === String(ADHOC_WS_PORT)) nextUrl = relayBase + parsed.pathname + parsed.search;
                } catch(e) {}
              }
              if (location.protocol === "https:" && nextUrl.startsWith("ws://")) {
          """)

          rep("""  const base = `${scheme}://${relayHost}:${ADHOC_WS_PORT}`;
          """, """  const base = relayOverrideBase() || `${scheme}://${relayHost}:${ADHOC_WS_PORT}`;
          """)
          open(p, "w").write(s)
          print("Parche de servidor externo (?relay=) aplicado")
          EOF

      - name: Parche - P2P WebRTC en la pagina (conexion directa entre jugadores)
        run: |
          python3 - <<'EOF'
          p = "upstream/wasm-page/public/ppsspp-runtime.js"
          s = open(p).read()
          def rep(old, new):
              global s
              assert s.count(old) == 1, "ppsspp-runtime.js (P2P): no se encontro: " + old[:70]
              s = s.replace(old, new)
          P2P_JS = '// ── pes2009-web: canal P2P WebRTC para el trafico UDP (PDP) del partido ──\n// Los paquetes van directo entre navegadores; si el canal no esta abierto se usa el relay (tunel).\nconst P2P_MODES = {\n  rapida:      { ordered: false, maxRetransmits: 0 },\n  equilibrada: { ordered: false, maxPacketLifeTime: 150 },\n  fiable:      { ordered: true },\n};\nfunction p2pModeName() {\n  let v = "";\n  try {\n    const q = new URLSearchParams(location.search).get("p2p");\n    if (q) sessionStorage.setItem("pes2009.p2p", q.toLowerCase());\n    v = (q || sessionStorage.getItem("pes2009.p2p") || "").toLowerCase();\n  } catch(e) {}\n  if (v === "off" || v === "no") return "off";\n  return P2P_MODES[v] ? v : "fiable";\n}\nfunction p2pBufferMs() {\n  let v = null;\n  try {\n    const q = new URLSearchParams(location.search).get("buffer");\n    if (q !== null) sessionStorage.setItem("pes2009.buffer", q);\n    v = q !== null ? q : sessionStorage.getItem("pes2009.buffer");\n  } catch(e) {}\n  const n = parseInt(v, 10);\n  return Number.isFinite(n) && n >= 0 && n <= 500 ? n : 80;\n}\nconst pesP2P = {\n  started: false, ws: null, selfMac: "", selfIp: "",\n  peers: new Map(),   // mac -> peer\n  byIp: new Map(),    // ip virtual (10.0.0.x) -> peer\n  socks: new Map(),   // puerto local -> socket PDP\n  queue: [],\n  maxLag: 0,\n};\nfunction p2pLog(text, level) {\n  try { log("P2P: " + text, level); } catch(e) { console.log("P2P: " + text); }\n}\nfunction p2pSendSignal(obj) {\n  const data = new TextEncoder().encode(JSON.stringify(obj));\n  if (pesP2P.ws && pesP2P.ws.readyState === 1) pesP2P.ws.send(data);\n  else pesP2P.queue.push(data);\n}\nfunction p2pStart() {\n  if (pesP2P.started || p2pModeName() === "off" || typeof RTCPeerConnection !== "function") return;\n  const cfg = loadNetworkConfig();\n  if (!cfg.enabled) return;\n  pesP2P.started = true;\n  pesP2P.selfMac = String(cfg.mac).toLowerCase();\n  p2pLog("activado, modo " + p2pModeName() + ", buffer de jitter " + p2pBufferMs() + " ms");\n  p2pConnectSignal();\n  let lastTick = performance.now();\n  setInterval(() => {   // si el navegador esta trabado, este timer llega tarde\n    const now = performance.now();\n    pesP2P.maxLag = Math.max(pesP2P.maxLag, now - lastTick - 100);\n    lastTick = now;\n  }, 100);\n  setInterval(p2pReportStats, 3000);\n}\nfunction p2pConnectSignal() {\n  const ws = new WebSocket(relayUrl("/rtc", { mac: pesP2P.selfMac }), "binary");\n  ws.binaryType = "arraybuffer";\n  pesP2P.ws = ws;\n  ws.onopen = () => { while (pesP2P.queue.length) ws.send(pesP2P.queue.shift()); };\n  ws.onmessage = ev => {\n    let m;\n    try { m = JSON.parse(new TextDecoder().decode(ev.data)); } catch(e) { return; }\n    p2pOnSignal(m);\n  };\n  ws.onclose = () => { if (pesP2P.ws === ws) setTimeout(p2pConnectSignal, 2000); };\n}\nfunction p2pOnSignal(m) {\n  if (m.type === "peers") {\n    pesP2P.selfIp = m.self || "";\n    const alive = new Set();\n    for (const info of m.peers || []) {\n      alive.add(info.mac);\n      const p = pesP2P.peers.get(info.mac);\n      if (!p) p2pCreatePeer(info.mac, info.ip);\n      else if (p.ip !== info.ip) { pesP2P.byIp.delete(p.ip); p.ip = info.ip; pesP2P.byIp.set(info.ip, p); }\n    }\n    for (const [mac, p] of pesP2P.peers) if (!alive.has(mac)) p2pClosePeer(p);\n  } else if (m.type === "signal") {\n    let p = pesP2P.peers.get(m.from);\n    if (!p && m.ip) p = p2pCreatePeer(m.from, m.ip);\n    if (p) p2pHandleRemote(p, m.data || {});\n  }\n}\nfunction p2pCreatePeer(mac, ip) {\n  const pc = new RTCPeerConnection({\n    iceServers: [{ urls: ["stun:stun.cloudflare.com:3478", "stun:stun.l.google.com:19302"] }],\n  });\n  const p = { mac, ip, pc, dc: null, open: false, pending: [], sent: 0, recv: 0, maxGap: 0, lastRecv: 0,\n              lastSend: 0, maxSendGap: 0, minTransit: null, minTransitPrev: null, minWindowStart: 0,\n              maxJitter: 0, late: 0, queue: [], lastDue: 0, timer: null };\n  pesP2P.peers.set(mac, p);\n  pesP2P.byIp.set(ip, p);\n  pc.onicecandidate = ev => {\n    if (ev.candidate) p2pSendSignal({ type: "signal", to: mac, data: { candidate: ev.candidate.toJSON() } });\n  };\n  pc.onconnectionstatechange = () => {\n    const st = pc.connectionState;\n    if (st === "failed") { p.open = false; p2pStatus(p, "no se pudo conectar directo, se usa el tunel"); }\n    if (st === "disconnected") { p.open = false; p2pStatus(p, "conexion directa interrumpida, se usa el tunel"); }\n  };\n  pc.ondatachannel = ev => p2pSetupChannel(p, ev.channel);\n  if (pesP2P.selfMac > mac) {   // inicia el de MAC mayor (evita que ambos ofrezcan a la vez)\n    p2pSetupChannel(p, pc.createDataChannel("pdp", P2P_MODES[p2pModeName()]));\n    pc.createOffer()\n      .then(o => pc.setLocalDescription(o))\n      .then(() => p2pSendSignal({ type: "signal", to: mac, data: { sdp: pc.localDescription.toJSON() } }))\n      .catch(e => p2pLog("error creando oferta: " + e, "warn"));\n  }\n  return p;\n}\nasync function p2pHandleRemote(p, data) {\n  try {\n    if (data.sdp) {\n      await p.pc.setRemoteDescription(data.sdp);\n      for (const c of p.pending.splice(0)) await p.pc.addIceCandidate(c);\n      if (data.sdp.type === "offer") {\n        await p.pc.setLocalDescription(await p.pc.createAnswer());\n        p2pSendSignal({ type: "signal", to: p.mac, data: { sdp: p.pc.localDescription.toJSON() } });\n      }\n    } else if (data.candidate) {\n      if (p.pc.remoteDescription) await p.pc.addIceCandidate(data.candidate);\n      else p.pending.push(data.candidate);\n    }\n  } catch(e) {\n    p2pLog("error de senalizacion: " + e, "warn");\n  }\n}\nfunction p2pSetupChannel(p, dc) {\n  dc.binaryType = "arraybuffer";\n  p.dc = dc;\n  dc.onopen = async () => {\n    p.open = true;\n    let via = "";\n    try {\n      const stats = await p.pc.getStats();\n      stats.forEach(s => {\n        if (s.type === "candidate-pair" && s.nominated && s.state === "succeeded") {\n          const lc = stats.get(s.localCandidateId), rc = stats.get(s.remoteCandidateId);\n          if (lc && rc) via = lc.candidateType + "/" + rc.candidateType;\n        }\n      });\n    } catch(e) {}\n    p2pStatus(p, "CONECTADO DIRECTO" + (via ? " (" + via + ")" : "") + ", modo " + p2pModeName());\n  };\n  dc.onclose = () => { p.open = false; };\n  dc.onmessage = ev => p2pDeliver(p, new Uint8Array(ev.data));\n}\nfunction p2pDeliver(p, d) {\n  // Trama "PD2" + puerto origen (2) + puerto destino (2) + hora de envio ms (4) + datos\n  if (d.length < 11 || d[0] !== 0x50 || d[1] !== 0x44 || d[2] !== 0x32) return;\n  const srcPort = (d[3] << 8) | d[4], dstPort = (d[5] << 8) | d[6];\n  const sendT = ((d[7] << 24) | (d[8] << 16) | (d[9] << 8) | d[10]) >>> 0;\n  const now = performance.now();\n  if (p.lastRecv) p.maxGap = Math.max(p.maxGap, now - p.lastRecv);\n  p.lastRecv = now;\n  p.recv++;\n  // tiempo de transito relativo (los relojes de ambos PCs no coinciden; solo importa la variacion)\n  const transit = ((Math.round(now) >>> 0) - sendT) | 0;\n  if (now - p.minWindowStart > 10000) { p.minTransitPrev = p.minTransit; p.minTransit = null; p.minWindowStart = now; }\n  if (p.minTransit === null || transit < p.minTransit) p.minTransit = transit;\n  const base = p.minTransitPrev === null ? p.minTransit : Math.min(p.minTransit, p.minTransitPrev);\n  const jitter = transit - base;   // cuanto llego tarde este paquete respecto al mas rapido\n  p.maxJitter = Math.max(p.maxJitter, jitter);\n  const item = { dstPort, srcPort, data: d.slice(11) };\n  const buffer = p2pBufferMs();\n  if (buffer <= 0) { p2pPush(p, item); return; }\n  // entregar al juego al mismo ritmo en que se envio: hora de envio + retraso fijo\n  let due = now + (buffer - jitter);\n  if (due < now) { p.late++; due = now; }\n  if (due < p.lastDue) due = p.lastDue;   // nunca desordenar\n  p.lastDue = due;\n  p.queue.push({ due, item });\n  p2pPump(p);\n}\nfunction p2pPush(p, item) {\n  const sock = pesP2P.socks.get(item.dstPort);\n  if (!sock || sock.__ppssppClosed) return;\n  sock.recv_queue.push({ addr: p.ip, port: item.srcPort, data: item.data });\n  window.SOCKFS.emit("message", sock.stream.fd);\n}\nfunction p2pPump(p) {\n  const now = performance.now();\n  while (p.queue.length && p.queue[0].due <= now + 1) p2pPush(p, p.queue.shift().item);\n  if (p.timer || !p.queue.length) return;\n  p.timer = setTimeout(() => { p.timer = null; p2pPump(p); }, Math.max(0, p.queue[0].due - performance.now()));\n}\nfunction p2pTrySend(dstHost, srcPort, dstPort, payload) {\n  const p = pesP2P.byIp.get(dstHost);\n  if (!p || !p.open || !p.dc || p.dc.readyState !== "open") return false;\n  const now = performance.now();\n  if (p.lastSend) p.maxSendGap = Math.max(p.maxSendGap, now - p.lastSend);\n  p.lastSend = now;\n  const t = Math.round(now) >>> 0;\n  const f = new Uint8Array(11 + payload.byteLength);\n  f[0] = 0x50; f[1] = 0x44; f[2] = 0x32;\n  f[3] = (srcPort >> 8) & 255; f[4] = srcPort & 255;\n  f[5] = (dstPort >> 8) & 255; f[6] = dstPort & 255;\n  f[7] = (t >>> 24) & 255; f[8] = (t >>> 16) & 255; f[9] = (t >>> 8) & 255; f[10] = t & 255;\n  f.set(payload, 11);\n  try { p.dc.send(f); p.sent++; } catch(e) { p2pLog("error enviando por canal directo: " + e, "warn"); }\n  return true;   // una vez abierto el canal directo, todo va por ahi (no mezclar con el tunel)\n}\nfunction p2pStatus(p, text) {\n  p2pLog(p.ip + ": " + text, text.startsWith("CONECTADO") ? "ok" : "warn");\n  p2pSendSignal({ type: "status", peer: p.mac, ip: p.ip, text });\n}\nasync function p2pReportStats() {\n  for (const p of pesP2P.peers.values()) {\n    if (!p.open) continue;\n    let rtt = null;\n    try {\n      (await p.pc.getStats()).forEach(s => {\n        if (s.type === "candidate-pair" && s.nominated && s.currentRoundTripTime != null) rtt = s.currentRoundTripTime;\n      });\n    } catch(e) {}\n    if (p.sent || p.recv) {\n      p2pSendSignal({ type: "stats", ip: p.ip, sent: p.sent, recv: p.recv, gap: Math.round(p.maxGap),\n                      rtt: rtt == null ? null : Math.round(rtt * 1000), lag: Math.max(0, Math.round(pesP2P.maxLag)),\n                      jitter: Math.round(p.maxJitter), sendGap: Math.round(p.maxSendGap), late: p.late, buffer: p2pBufferMs() });\n    }\n    p.sent = 0; p.recv = 0; p.maxGap = 0; p.maxJitter = 0; p.maxSendGap = 0; p.late = 0;\n  }\n  pesP2P.maxLag = 0;\n}\nfunction p2pClosePeer(p) {\n  try { p.pc.close(); } catch(e) {}\n  pesP2P.peers.delete(p.mac);\n  if (pesP2P.byIp.get(p.ip) === p) pesP2P.byIp.delete(p.ip);\n}\n\n'
          rep("function installSockFSAdhocRelay() {\n", P2P_JS + "function installSockFSAdhocRelay() {\n")
          rep('    log("Network: UDP relay open port " + sock.sport);\n',
              '    log("Network: UDP relay open port " + sock.sport);\n'
              '    pesP2P.socks.set(sock.sport, sock);\n'
              '    p2pStart();\n')
          rep("    const frame = relayPacket(addr, port, socketPayload(buffer, offset, length));\n",
              "    const payload = socketPayload(buffer, offset, length);\n"
              "    if (p2pTrySend(numericHostToText(addr), sock.sport, port, payload)) return length;\n"
              "    const frame = relayPacket(addr, port, payload);\n")
          rep("    sock.__ppssppClosed = true;\n",
              "    sock.__ppssppClosed = true;\n"
              "    if (pesP2P.socks.get(sock.sport) === sock) pesP2P.socks.delete(sock.sport);\n")
          open(p, "w").write(s)
          print("Parche P2P (WebRTC) en la pagina aplicado")
          EOF

      - name: Parche - P2P WebRTC en el servidor (senalizacion y estadisticas)
        run: |
          python3 - <<'EOF'
          p = "upstream/server/serve.py"
          s = open(p).read()
          def rep(old, new):
              global s
              assert s.count(old) == 1, "serve.py (P2P): no se encontro: " + old[:70]
              s = s.replace(old, new)
          rep("import argparse\n", "import argparse\nimport json\n")
          rep("        self.next_tcp_id = 1\n", "        self.next_tcp_id = 1\n        self.rtc = {}\n")
          rep("            self.ip_to_mac.pop(user.ip_text, None)\n",
              "            self.ip_to_mac.pop(user.ip_text, None)\n        self.rtc_broadcast()\n")
          rep("        self.ip_to_mac[user.ip_text] = _mac_text(user.mac)\n",
              "        self.ip_to_mac[user.ip_text] = _mac_text(user.mac)\n        self.rtc_broadcast()\n")
          rep("    def connect(self, user, group):\n", """    def rtc_ip(self, mac):
                  with self.lock:
                      return next((ip for ip, m in self.ip_to_mac.items() if m == mac), None)

              def rtc_register(self, mac, handler):
                  with self.lock:
                      self.rtc[mac] = handler
                  print(f"P2P: {mac} listo para conexion directa", flush=True)
                  self.rtc_broadcast()

              def rtc_unregister(self, mac, handler):
                  with self.lock:
                      if self.rtc.get(mac) is handler:
                          del self.rtc[mac]
                  self.rtc_broadcast()

              def rtc_broadcast(self):
                  with self.lock:
                      entries = [(mac, h, next((ip for ip, m in self.ip_to_mac.items() if m == mac), None))
                                 for mac, h in self.rtc.items()]
                  for mac, h, ip in entries:
                      peers = [{"mac": m2, "ip": ip2} for m2, h2, ip2 in entries if m2 != mac and ip2]
                      h.send_json({"type": "peers", "self": ip, "peers": peers})

              def connect(self, user, group):
          """)
          rep("        self.tcp_peers = {}\n", "        self.tcp_peers = {}\n        self.rtc_mac = \"\"\n")
          rep('        if self.mode == "tcp-connect":\n',
              '        if self.mode == "rtc":\n            self._handle_rtc()\n            return\n        if self.mode == "tcp-connect":\n')
          rep('            elif parsed.path == "/tcp-connect":\n',
              '            elif parsed.path == "/rtc":\n'
              '                self.mode = "rtc"\n'
              '                self.rtc_mac = query.get("mac", [""])[0].lower()\n'
              '            elif parsed.path == "/tcp-connect":\n')
          rep("    def send_udp(self, source_host, source_port, payload):\n", """    def send_json(self, obj):
                  self.send(json.dumps(obj).encode("utf-8"))

              def _handle_rtc(self):
                  mac = self.rtc_mac
                  if not mac:
                      return
                  self.lobby.rtc_register(mac, self)
                  try:
                      while self.alive:
                          payload = self._read_frame()
                          if payload is None:
                              break
                          if not payload:
                              continue
                          try:
                              m = json.loads(payload.decode("utf-8"))
                          except ValueError:
                              continue
                          kind = m.get("type")
                          me = self.lobby.rtc_ip(mac) or mac
                          if kind == "signal":
                              target = self.lobby.rtc.get(str(m.get("to", "")).lower())
                              if target:
                                  target.send_json({"type": "signal", "from": mac, "ip": self.lobby.rtc_ip(mac), "data": m.get("data")})
                          elif kind == "status":
                              print(f"P2P: {me} -> {m.get('ip')}: {m.get('text')}", flush=True)
                          elif kind == "stats":
                              gap = m.get("gap") or 0
                              rtt = m.get("rtt")
                              aviso = "  <-- CONGELON" if gap >= 500 else ""
                              rtt_txt = f"rtt {rtt} ms" if rtt is not None else "rtt ?"
                              lag = m.get("lag") or 0
                              jit = m.get("jitter") or 0
                              sgap = m.get("sendGap") or 0
                              late = m.get("late") or 0
                              buf = m.get("buffer")
                              lag_txt = f"  navegador {me} trabado {lag} ms" + ("  <-- NAVEGADOR LENTO" if lag >= 300 else "")
                              jit_txt = f"  jitter red {jit} ms" + ("  <-- RED IRREGULAR" if jit >= 150 else "")
                              buf_txt = f"  buffer {buf} ms" + (f" ({late} tarde)" if late else "")
                              print(f"P2P {time.strftime('%H:%M:%S')}: {m.get('ip')} -> {me}  {m.get('recv')} paq  pausa max {gap} ms  {rtt_txt}{jit_txt}{buf_txt}  | {me} envia pausa max {sgap} ms  [directo]{aviso}{lag_txt}", flush=True)
                  finally:
                      self.lobby.rtc_unregister(mac, self)

              def send_udp(self, source_host, source_port, payload):
          """)
          open(p, "w").write(s)
          print("Parche P2P (senalizacion) en el servidor aplicado")
          EOF

